[project]
name = "csat-analysis"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "en-core-web-sm",
    "pdfplumber>=0.11.10",
    "spacy>=3.8,<3.9",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
